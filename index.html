  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      document.documentElement.dataset.theme = t
    } catch { }
